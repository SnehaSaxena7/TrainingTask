<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Method Chaining</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        .cls{
            width:300px;
            height:300px;
            background-color:red;
            margin:20px;
        }

        button{
            padding:10px 20px;
            margin:10px;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="cls"></div>

<button id="chain">Start Chaining Method</button>
<button id="ab">Border</button>

<script>
$(document).ready(function(){

    $("#chain").click(function(){

        $(".cls")
        .hide(2000)
        .show(2000)
        .slideUp(2000)
        .slideDown(2000);

    });

    $("#ab").click(function(){

        $(".cls").css("border","10px solid blue");

    });

});
</script>

</body>
</html>
